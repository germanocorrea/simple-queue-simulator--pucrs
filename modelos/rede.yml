# Rede genérica com roteamento probabilístico.
#
# simulation:
#   max_randoms  quantidade de números pseudoaleatórios usados (a simulação para quando acabam)
#   seed         semente do gerador congruente linear
#
# queues:        cada chave é o nome de uma fila
#   servers        número de servidores (obrigatório)
#   capacity       capacidade (omitir = infinita)
#   service        [min, max] do tempo de atendimento (obrigatório)
#   arrival        [min, max] do intervalo entre chegadas externas (só nas filas que recebem de fora)
#   first_arrival  instante da primeira chegada externa (padrão 1.0)
#   routing        destino: probabilidade, testados na ordem escrita.
#                  'exit' é o exterior. Se a soma for < 1, o restante vai para o exterior.
#                  A soma não pode passar de 1.
simulation:
  max_randoms: 100000
  seed: 42

queues:
  Q1:                      # G/G/1 (capacidade infinita)
    servers: 1
    arrival: [2.0, 4.0]
    first_arrival: 2.0
    service: [1.0, 2.0]
    routing:
      Q2: 0.2              # rnd < 0.2        -> Q2
      Q3: 0.8              # 0.2 <= rnd < 1.0 -> Q3

  Q2:                      # G/G/2/5
    servers: 2
    capacity: 5
    service: [4.0, 6.0]
    routing:
      Q1: 0.3              # rnd < 0.3        -> Q1
      Q3: 0.5              # 0.3 <= rnd < 0.8 -> Q3
      exit: 0.2            # 0.8 <= rnd < 1.0 -> exterior

  Q3:                      # G/G/2/10
    servers: 2
    capacity: 10
    service: [5.0, 15.0]
    routing:
      Q2: 0.7              # rnd < 0.7 -> Q2
      # 0.3 restante -> exterior
